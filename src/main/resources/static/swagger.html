<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Swagger UI</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist/swagger-ui.css" />
</head>
<body>
<div id="swagger-ui"></div>
<script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>
<script>
    const ui = SwaggerUIBundle({
        urls: [
            { name: 'Account API', url: '/account-api/v3/api-docs' },
            { name: 'Order API', url: '/order-api/v3/api-docs' },
            { name: 'Book API', url: '/order-api/v3/api-docs' },
            { name: 'Review API', url: '/order-api/v3/api-docs' },
            { name: 'Cart API', url: '/order-api/v3/api-docs' }
        ],
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
            SwaggerUIBundle.presets.apis
        ],
        layout: "BaseLayout"
    });
</script>
</body>
</html>
